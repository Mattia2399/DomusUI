name: Report a bug
description: Report reproducible behavior in Domus UI
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Do not include tokens, PINs, private URLs, or household data. Report vulnerabilities privately as described in SECURITY.md.
  - type: input
    id: domus_ui_version
    attributes:
      label: Domus UI version
      description: Find it in Support & feedback or Settings > Advanced.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: home_assistant_version
    attributes:
      label: Home Assistant version
      placeholder: 2026.8.x
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation
      options:
        - HACS
        - Development environment
        - Legacy installation
    validations:
      required: true
  - type: dropdown
    id: device_class
    attributes:
      label: Device
      options:
        - Desktop
        - Tablet
        - Smartphone
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Affected page
      description: Name the section without including your server's private address.
      placeholder: /home, /rooms, /security, /settings...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser or app
      placeholder: Chrome 140, Safari iOS, Home Assistant Companion...
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior you observed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: Describe the expected result.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      options:
        - Always
        - Often
        - Sometimes
        - Once
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshots or video
      description: Drag attachments here after hiding names, addresses, and household data.
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: If possible, attach the file generated by Domus UI > Profile > Support & feedback.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked that an equivalent issue does not already exist.
          required: true
        - label: I removed tokens, PINs, private URLs, and personal data.
          required: true
