name: Public release gate

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript, build, audit and HACS package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify public release
        run: npm run release:gate

      - name: Create English release notes
        run: npm run release:notes

      - name: Save verified package
        uses: actions/upload-artifact@v4
        with:
          name: domusos-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
