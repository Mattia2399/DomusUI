name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish HACS package
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${PACKAGE_VERSION}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match package version v${PACKAGE_VERSION}."
            exit 1
          }

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Release gate
        run: npm run release:gate

      - name: Create release packages
        run: npm run release:package

      - name: Create English release notes
        run: npm run release:notes

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: Domus UI ${{ github.ref_name }}
          body_path: release-artifacts/RELEASE_NOTES.md
          generate_release_notes: true
          # HACS excludes GitHub prereleases unless every user enables beta
          # versions. Domus UI keeps the beta channel explicit in the SemVer
          # tag while publishing an ordinary GitHub Release for direct HACS
          # installation.
          prerelease: false
          make_latest: true
          files: |
            release-artifacts/domusos.zip
            release-artifacts/*.tar.gz
            release-artifacts/SHA256SUMS
