name: Domus Core backend

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-domus-core:
    name: Home Assistant ${{ matrix.home_assistant }} backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - home_assistant: '2025.1'
            python: '3.12'
            test_package: '0.13.201'
            test_target: 'tests_python/test_irrigation_models.py tests_python/test_irrigation_manager.py tests_python/test_calendar.py tests_python/test_core_*.py tests_python/test_context_providers.py tests_python/test_energy_models.py tests_python/test_energy_adapter.py tests_python/test_energy_discovery.py tests_python/test_energy_provider.py tests_python/test_energy_tariff.py tests_python/test_energy_websocket_handlers.py tests_python/test_energy_profile_v2.py tests_python/test_energy_storage_v2.py tests_python/test_energy_aggregation.py tests_python/test_energy_meters.py tests_python/test_energy_discovery_v2.py tests_python/test_energy_history.py tests_python/test_energy_analytics.py tests_python/test_waste_collection.py tests_python/test_waste_collection_recipients.py tests_python/test_waste_reminder_text.py tests_python/test_profile_identity.py tests_python/test_profile_store.py tests_python/test_profile_websocket.py tests_python/test_profile_lifecycle.py tests_python/test_profile_devices.py tests_python/test_profile_device_commands.py tests_python/test_profile_notification_test.py tests_python/test_notification_router.py tests_python/test_notification_delivery.py tests_python/test_notification_ledger.py tests_python/test_notification_recipients.py tests_python/test_device_power_models.py tests_python/test_device_power_manager.py tests_python/test_climate_config.py tests_python/test_climate_programs.py tests_python/test_climate_auto_resolver.py tests_python/test_climate_auto_timer.py tests_python/test_climate_overrides.py tests_python/test_climate_architecture.py tests_python/test_climate_manager.py tests_python/test_climate_intent.py tests_python/test_climate_state_manager.py tests_python/test_climate_runtime_audit.py tests_python/test_climate_execution_plan.py tests_python/test_climate_execution_safety.py tests_python/test_climate_supervisory_adapter.py tests_python/test_access_models.py tests_python/test_access_manager.py tests_python/test_access_contract.py tests_python/test_access_authorization.py tests_python/test_access_actions.py tests_python/test_access_authorization_ha.py tests_python/test_access_shadow.py tests_python/test_access_shadow_ha.py tests_python/test_access_administration.py tests_python/test_access_people_ha.py tests_python/test_access_unattributed.py tests_python/test_access_enforcement.py tests_python/test_access_enforcement_ha.py'
          - home_assistant: '2026.2.3'
            python: '3.13'
            test_package: '0.13.316'
            test_target: 'tests_python'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: pip install pytest-homeassistant-custom-component==${{ matrix.test_package }}
      - name: Climate service-call static guard
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          found = []
          for path in Path('custom_components/domusos/climate').rglob('*.py'):
              tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              for node in ast.walk(tree):
                  if not isinstance(node, ast.Call) or not isinstance(node.func, ast.Attribute):
                      continue
                  if node.func.attr != 'async_call':
                      continue
                  owner = node.func.value
                  if isinstance(owner, ast.Attribute) and owner.attr == 'services':
                      found.append((path.name, [arg.value if isinstance(arg, ast.Constant) else None for arg in node.args[:2]]))
          assert sorted(found) == sorted([
              ('supervisory_adapter.py', ['climate', 'set_hvac_mode']),
              ('supervisory_adapter.py', ['climate', 'set_temperature']),
          ]), found
          PY
      - name: Test Domus Core backend
        # The HA 2025.1 websocket test fixture leaves its own aiohttp shutdown
        # thread alive on modern GitHub runners. Core lifecycle compatibility is
        # still covered there, the Energy commands run there through their
        # handlers, and the complete websocket contract runs on current HA.
        run: pytest -q ${{ matrix.test_target }}
