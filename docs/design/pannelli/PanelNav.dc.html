<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Pannello navigazione</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.pn-root{--ink:#111113;--t2:rgba(60,60,67,.66);--t3:rgba(60,60,67,.42);--glass:rgba(60,40,20,.08);--glass2:rgba(60,40,20,.13);--on:#0B0B0F;--on-t:#FFFFFF;--track:rgba(60,40,20,.10);position:absolute;inset:0;overflow:hidden;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI Variable',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#F2F2F6;container-type:inline-size}
.pn-root.is-dark{--ink:#F5F5F7;--t2:rgba(235,235,245,.66);--t3:rgba(235,235,245,.42);--glass:rgba(255,255,255,.11);--glass2:rgba(255,255,255,.17);--on:#F5F5F7;--on-t:#0B0B0F;--track:rgba(255,255,255,.12);background:#000}
.pn-root button{font:inherit;color:inherit;border:0;margin:0;-webkit-tap-highlight-color:transparent}
.pn-root button:focus-visible,.pn-vs:focus-visible,.pn-disc:focus-visible{outline:3px solid #0A84FF;outline-offset:2px}
.pn-app{position:absolute;inset:0;background:#8E8E93}
.pn-root.is-dark .pn-app{background:#0B0B0C}
.pn-app i{position:absolute;border-radius:28px;background:rgba(255,255,255,.18);filter:blur(6px)}
.pn-app .a1{left:16px;top:20px;width:56px;height:56px;border-radius:50%}.pn-app .a2{right:16px;top:20px;width:56px;height:56px;border-radius:50%}.pn-app .a3{left:8px;right:8px;top:66px;height:60px}
.pn-sheet{position:absolute;left:0;right:0;bottom:0;height:min(90%,720px);box-sizing:border-box;border-radius:30px 30px 0 0;padding:0 20px 26px;display:flex;flex-direction:column;gap:18px;box-shadow:0 -20px 60px -30px rgba(0,0,0,.45);transition:background 420ms ease}
.pn-grab{position:absolute;top:10px;left:50%;width:48px;height:5px;margin-left:-24px;border-radius:3px;background:var(--glass2)}
.pn-root.is-col .pn-sheet{inset:12px;height:auto;border-radius:30px;padding-bottom:22px;box-shadow:0 0 0 1px rgba(0,0,0,.05),0 30px 60px -40px rgba(0,0,0,.4)}
.pn-root.is-col.is-dark .pn-sheet{box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.pn-head{flex:none;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;padding-top:24px;text-align:center}
.pn-hic{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:12px;transition:background 400ms ease}
.pn-root span:not([class]){display:contents}
.pn-ht{grid-column:2;grid-row:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.pn-name{font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.2;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn-state{font-size:13px;font-weight:600;color:var(--t2);margin-top:2px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.pn-x,.pn-hpow{grid-row:1;width:44px;height:44px;border-radius:50%;background:var(--glass);display:flex;align-items:center;justify-content:center;cursor:pointer}
.pn-hero{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:12px}
.pn-chip{flex:none;height:32px;padding:0 14px 0 9px;border-radius:16px;background:var(--glass);display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--t2);cursor:pointer;animation:pnIn 260ms ease both}
.pn-chl{color:var(--ink)}
.pn-stage{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
@keyframes pnIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pn-chip,.pn-vs,.pn-discw,.pn-ringw,.pn-tiles,.pn-data{animation:none!important}}
.pn-vs{position:relative;width:148px;flex:1 1 auto;min-height:0;max-height:300px;border-radius:44px;overflow:hidden;cursor:ns-resize;touch-action:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);animation:pnIn 260ms ease both}
.pn-fill{position:absolute;left:0;right:0;bottom:0;transition:height 160ms ease,background 300ms ease}
.pn-vs.is-drag .pn-fill{transition:background 300ms ease}
.pn-vs.is-ct .pn-fill{background:transparent!important}
.pn-hdl{position:absolute;left:18px;right:18px;height:6px;margin-bottom:-3px;border-radius:3px;background:#FFFFFF;box-shadow:0 0 0 1px rgba(0,0,0,.14),0 4px 12px rgba(0,0,0,.25);transition:bottom 160ms ease}
.pn-tick{position:absolute;left:0;right:0;height:2px;margin-bottom:-1px;background:var(--sheet,rgba(255,255,255,.6));opacity:.7}
.pn-mk{position:absolute;left:0;right:0;height:0;border-top:2px dashed rgba(255,255,255,.95);mix-blend-mode:normal}
.pn-vs.is-low .pn-mk{border-top-color:var(--t2)}
.pn-mk em{position:absolute;left:12px;top:-24px;font-style:normal;font-size:11px;font-weight:700;padding:2px 7px;border-radius:9px;background:rgba(0,0,0,.28);color:#FFF}
.pn-vv{position:absolute;left:0;right:0;top:22px;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.pn-vv b{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05}
.pn-vsub{font-size:12px;font-weight:600;opacity:.75;margin-top:2px}
.pn-pills{flex:none;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;animation:pnIn 260ms ease both}
.pn-pills button,.pn-seg button{height:44px;padding:0 16px;border-radius:22px;background:var(--glass);font-size:14px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.pn-pills button.is-sel,.pn-seg button.is-sel{background:var(--on);color:var(--on-t)}
.pn-discw{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;animation:pnIn 260ms ease both}
.pn-disc{position:relative;height:100%;max-height:250px;max-width:100%;aspect-ratio:1;border-radius:50%;cursor:crosshair;touch-action:none;background:radial-gradient(circle closest-side,#FFFFFF 0%,rgba(255,255,255,.85) 18%,rgba(255,255,255,0) 100%),conic-gradient(from 90deg,#FF3B30,#FF9500,#FFE620,#7CF000,#28E07A,#2BE0E0,#2F7BFF,#6A3BFF,#C03BFF,#FF3BC4,#FF3B30);-webkit-mask:radial-gradient(circle closest-side,#000 97%,transparent 100%);mask:radial-gradient(circle closest-side,#000 97%,transparent 100%)}
.pn-disc-h{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:3px solid #FFFFFF;box-sizing:border-box;box-shadow:0 0 0 1px rgba(0,0,0,.12),0 6px 16px rgba(0,0,0,.28);pointer-events:none}
.pn-sws{flex:none;display:flex;gap:2px;justify-content:center}
.pn-sw{width:44px;height:44px;border-radius:50%;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer}
.pn-sw i{width:32px;height:32px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.pn-sw.is-sel i{box-shadow:0 0 0 2px var(--sheetc,#FFF),0 0 0 4px var(--ink)}
.pn-ringw{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;animation:pnIn 260ms ease both}
.pn-ring{position:relative;height:100%;max-height:236px;max-width:100%;aspect-ratio:1}
.pn-ring i{position:absolute;inset:0;border-radius:50%;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 18px),#000 calc(100% - 17px));mask:radial-gradient(farthest-side,transparent calc(100% - 18px),#000 calc(100% - 17px))}
.pn-rv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pn-ring b{font-size:40px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pn-rs{font-size:13px;font-weight:600;color:var(--t2);margin-top:2px}
.pn-tiles{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;animation:pnIn 260ms ease both}
.pn-tile{height:96px;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:background 200ms ease}
.pn-tll{font-size:13px;font-weight:600}
.pn-data{width:100%;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:10px;animation:pnIn 260ms ease both}
.pn-big{display:flex;align-items:flex-start;line-height:1}
.pn-big b{font-size:64px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.pn-u{font-size:30px;font-weight:600;margin-top:6px}
.pn-note{font-size:15px;font-weight:700;margin-top:-4px}
.pn-seg{display:flex;gap:6px;flex:none}
.pn-seg button{height:38px;padding:0 14px;font-size:13px}
.pn-chart{width:100%;flex:1;min-height:70px;max-height:230px;display:flex;flex-direction:column;gap:6px;padding:14px 14px 10px;box-sizing:border-box;border-radius:22px;background:var(--glass)}
.pn-chart.is-big{max-height:none}
.pn-chart svg{flex:1;min-height:0;width:100%;overflow:visible}
.pn-band{fill:rgba(48,209,88,.14)}
.pn-line{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.pn-cx{display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:var(--t3)}
.pn-stats{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:none}
.pn-st{display:flex;flex-direction:column;align-items:center;padding:10px 0;border-radius:16px;background:var(--glass)}
.pn-stl{font-size:12px;font-weight:600;color:var(--t2)}
.pn-stats b{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.pn-bar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);row-gap:12px}
.pn-bar.is-few{display:flex;justify-content:center;gap:40px}
.pn-sc{background:none;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:0;min-width:44px}
.pn-sc-c{position:relative;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background 220ms ease,color 220ms ease}
.pn-sc-l{font-size:12px;font-weight:600;color:var(--t2);white-space:nowrap}
.pn-sc.is-sel .pn-sc-l{color:var(--ink)}
.pn-sc.is-sel .pn-sc-c::after{content:'';position:absolute;left:50%;bottom:-31px;width:4px;height:4px;margin-left:-2px;border-radius:2px;background:var(--ink)}
.pn-pg{position:absolute;right:-3px;top:-3px;width:16px;height:16px;border-radius:50%;background:var(--glass2);color:var(--t2);display:flex;align-items:center;justify-content:center;font-style:normal;backdrop-filter:blur(6px)}
.pn-foot{flex:none;height:68px;display:flex;align-items:center;justify-content:center}
.pn-pow{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background 300ms ease}
.pn-mini{flex:none;display:flex;align-items:center;gap:12px;padding-top:26px}
.pn-mic{width:40px;height:40px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center}
.pn-mt{flex:1;min-width:0;display:flex;flex-direction:column}
.pn-mt b{font-size:17px;font-weight:700}
.pn-ms{font-size:13px;font-weight:600;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn-mpow,.pn-mx,.pn-back{width:40px;height:40px;flex:none;border-radius:50%;background:var(--glass);display:flex;align-items:center;justify-content:center;cursor:pointer}
.pn-ph{flex:none;margin-top:-4px;display:flex;align-items:center;gap:12px;animation:pnIn 260ms ease both}
.pn-ph b{font-size:24px;font-weight:700;letter-spacing:-.01em}
.pn-phs{margin-left:auto;font-size:13px;font-weight:600;color:var(--t2)}
.pn-list{flex:1;min-height:0;overflow:auto;margin:0 -20px -26px;padding:0 20px 26px;display:flex;flex-direction:column;gap:6px;animation:pnIn 300ms ease both}
.pn-root.is-col .pn-list{margin-bottom:-22px;padding-bottom:22px}
.pn-lh{font-size:13px;font-weight:700;color:var(--t2);padding:12px 6px 2px}
.pn-row{width:100%;min-height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;box-sizing:border-box;border-radius:18px;background:var(--glass);text-align:left;cursor:pointer}
.pn-ric{width:32px;height:32px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center}
.pn-rt{flex:1;min-width:0;display:flex;flex-direction:column}
.pn-rt b{font-size:16px;font-weight:600}
.pn-rsub{font-size:12px;font-weight:600;color:var(--t2);margin-top:1px}
.pn-row.is-sel .pn-rt b{font-weight:700}
.pn-row em{font-style:normal;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.pn-ck{display:flex;font-style:normal}
.pn-x{grid-column:3}
.pn-hpow{grid-column:1;transition:background 300ms ease,color 300ms ease}
.pn-mpow,.pn-mx{width:44px;height:44px}
.pn-vs.is-cover .pn-fill{display:none}
.pn-shut{position:absolute;left:0;right:0;top:0;background:repeating-linear-gradient(to bottom,rgba(250,250,252,.96) 0 13px,rgba(200,200,208,.96) 13px 15px);box-shadow:0 2px 0 rgba(0,0,0,.18);transition:height 400ms ease}
.pn-root.is-dark .pn-shut{background:repeating-linear-gradient(to bottom,rgba(92,92,98,.98) 0 13px,rgba(60,60,66,.98) 13px 15px)}
.pn-vs.is-cover .pn-vv{top:auto;bottom:22px}
.pn-root .pn-bigstop{flex:none;height:52px;padding:0 28px;border-radius:26px;background:var(--on);color:var(--on-t);display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;cursor:pointer;animation:pnIn 200ms ease both}
.pn-hb{flex:none;width:100%;display:flex;flex-direction:column;gap:8px}
.pn-hbl{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--t2);padding:0 4px}
.pn-hbl b{color:var(--ink)}.pn-hbl em{font-style:normal;font-variant-numeric:tabular-nums}
.pn-hbar{position:relative;height:46px;border-radius:16px;background:var(--track);overflow:hidden;cursor:ew-resize;touch-action:none}
.pn-hbf{position:absolute;left:0;top:0;bottom:0;transition:width 160ms ease}
.pn-opts{width:100%;height:100%;max-height:330px;display:flex;flex-direction:column;gap:10px;animation:pnIn 260ms ease both}
.pn-opts>span{display:contents}
.pn-opt{flex:1;min-height:0;border-radius:26px;display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;column-gap:14px;align-items:center;align-content:center;padding:0 22px;text-align:left;transition:background 220ms ease}
.pn-oi{grid-row:1/3;display:flex}
.pn-ol{font-size:22px;font-weight:700;letter-spacing:-.01em}
.pn-od{grid-column:2;font-size:13px;font-weight:600;opacity:.75}
.pn-ock{grid-column:3;grid-row:1/3;display:flex;font-style:normal}
.pn-opts.is-list{justify-content:center;gap:0;border-radius:24px;overflow:hidden;height:auto;background:var(--glass)}
.pn-opts.is-list .pn-opt{flex:none;height:72px;border-radius:0;background:transparent!important;color:var(--ink)!important;box-shadow:inset 0 -1px 0 var(--glass2)}
.pn-opts.is-list .pn-ock{color:var(--acc)}

</style>
</helmet>
<div class="pn-root {{rootCls}}" style="--acc: {{accVar}}" lang="it">
<sc-if value="{{isSheet}}" hint-placeholder-val="{{true}}"><div class="pn-app" aria-hidden="true"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div></sc-if>
<section class="pn-sheet" style="background: {{sheetBg}}" role="dialog" aria-label="{{name}}">
<sc-if value="{{isSheet}}" hint-placeholder-val="{{true}}"><span class="pn-grab" aria-hidden="true"></span></sc-if>

<header class="pn-head">
<sc-if value="{{hasPow}}" hint-placeholder-val="{{true}}"><button type="button" class="pn-hpow" style="background: {{powBg}}; color: {{powC}}" aria-label="{{powAria}}" aria-pressed="{{powPressed}}" onClick="{{powTap}}"><sc-if value="{{powIc.power2}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v8"></path><path d="M6.3 6.8a8 8 0 1 0 11.4 0"></path></svg></sc-if>
<sc-if value="{{powIc.stopSq}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"></rect></svg></sc-if></button></sc-if>
<span class="pn-ht"><b class="pn-name">{{name}}</b><span class="pn-state">{{state}}</span></span>
<button type="button" class="pn-x" aria-label="Chiudi"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</header>

<sc-if value="{{notPage}}" hint-placeholder-val="{{true}}">

<div class="pn-hero">
<sc-if value="{{hasChip}}" hint-placeholder-val="{{false}}"><button type="button" class="pn-chip" onClick="{{backMain}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg><span class="pn-chl">{{chipL}}</span></button></sc-if>
<div class="pn-stage">

<sc-if value="{{h.vs}}" hint-placeholder-val="{{true}}">
<div class="pn-vs {{h.vsCls}}" style="background: {{h.track}}" role="slider" aria-label="{{h.aria}}" aria-valuenow="{{h.now}}" tabindex="0" onPointerDown="{{h.down}}" onPointerMove="{{h.move}}" onPointerUp="{{h.up}}" onPointerCancel="{{h.up}}" onKeyDown="{{h.key}}">
<span class="pn-fill" style="height: {{h.fillH}}; background: {{h.fill}}"></span>
<sc-if value="{{h.cover}}" hint-placeholder-val="{{false}}"><span class="pn-shut" style="height: {{h.shutH}}"></span></sc-if>
<sc-for list="{{h.ticks}}" as="t" hint-placeholder-count="0"><span class="pn-tick" style="bottom: {{t.at}}"></span></sc-for>
<sc-if value="{{h.hasHandle}}" hint-placeholder-val="{{false}}"><span class="pn-hdl" style="bottom: {{h.fillH}}"></span></sc-if>
<sc-if value="{{h.hasMk}}" hint-placeholder-val="{{false}}"><span class="pn-mk" style="bottom: {{h.mkAt}}"><em>{{h.mkL}}</em></span></sc-if>
<span class="pn-vv" style="color: {{h.vC}}"><b>{{h.val}}</b><span class="pn-vsub">{{h.sub}}</span></span>
</div>
</sc-if>

<sc-if value="{{h.disc}}" hint-placeholder-val="{{false}}">
<div class="pn-discw"><div class="pn-disc" role="slider" aria-label="Colore" aria-valuenow="{{h.hue}}" tabindex="0" onPointerDown="{{h.down}}" onPointerMove="{{h.move}}" onPointerUp="{{h.up}}" onPointerCancel="{{h.up}}" onKeyDown="{{h.key}}"><span class="pn-disc-h" style="left: {{h.hx}}; top: {{h.hy}}; background: {{h.hc}}"></span></div></div>
<div class="pn-sws" role="radiogroup" aria-label="Colori rapidi"><sc-for list="{{h.sws}}" as="w" hint-placeholder-count="6"><button type="button" role="radio" aria-checked="{{w.on}}" aria-label="{{w.label}}" class="pn-sw {{w.cls}}" onClick="{{w.pick}}"><i style="background: {{w.c}}"></i></button></sc-for></div>
</sc-if>

<sc-if value="{{h.ring}}" hint-placeholder-val="{{false}}">
<div class="pn-ringw"><div class="pn-ring"><i style="background: {{h.ringBg}}"></i><span class="pn-rv"><b>{{h.ringV}}</b><span class="pn-rs">{{h.ringS}}</span></span></div></div>
</sc-if>

<sc-if value="{{h.opts}}" hint-placeholder-val="{{false}}">
<div class="pn-opts {{h.optsCls}}" role="radiogroup" aria-label="{{h.aria}}"><sc-for list="{{h.ol}}" as="o" hint-placeholder-count="2"><button type="button" role="radio" aria-checked="{{o.on}}" class="pn-opt {{o.cls}}" style="background: {{o.bg}}; color: {{o.c}}" onClick="{{o.pick}}"><span class="pn-oi"><sc-if value="{{o.ic.flame}}" hint-placeholder-val="{{true}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c.6 3.2 4.8 5.6 4.8 10.2A4.8 4.8 0 0 1 12 18a4.8 4.8 0 0 1-4.8-4.8c0-2 1-3.4 2.1-4.6.2 1.6 1 2.6 2.1 2.9C11.6 9 11.2 6 12 3z"></path><path d="M6 21h12"></path></svg></sc-if>
<sc-if value="{{o.ic.power2}}" hint-placeholder-val="{{false}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v8"></path><path d="M6.3 6.8a8 8 0 1 0 11.4 0"></path></svg></sc-if></span><b class="pn-ol">{{o.label}}</b><span class="pn-od">{{o.desc}}</span><sc-if value="{{o.sel}}" hint-placeholder-val="{{false}}"><i class="pn-ock"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></i></sc-if></button></sc-for></div>
