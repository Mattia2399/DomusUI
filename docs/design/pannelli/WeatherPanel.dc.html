<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Meteo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.wx-root{--accW:#3E7CC9}
.wx-root{position:absolute;inset:0;overflow:hidden;color:#FFFFFF;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI Variable',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#0B0B0D;--t2:rgba(255,255,255,.72);--t3:rgba(255,255,255,.5);--card:rgba(255,255,255,.14);--sep:rgba(255,255,255,.16)}
.wx-sky{position:absolute;inset:0;transition:background .8s}
.wx-rain{position:absolute;inset:0;background-image:repeating-linear-gradient(105deg,transparent 0 22px,rgba(255,255,255,.12) 22px 23px);animation:wx-r .6s linear infinite;opacity:.6}
@keyframes wx-r{to{background-position:-40px 120px}}
@media (prefers-reduced-motion: reduce){.wx-rain{animation:none}}
.wx-p{position:absolute;left:0;right:0;bottom:0;height:min(90%,760px);border-radius:30px 30px 0 0;display:flex;flex-direction:column;padding:16px 18px 0;box-sizing:border-box;background:rgba(255,255,255,.06);box-shadow:inset 0 1px 0 rgba(255,255,255,.18);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.wx-p.is-full{top:0;height:auto;border-radius:0;background:transparent;box-shadow:none}
.wx-h{display:flex;align-items:center;gap:12px;flex:none;padding-top:8px}
.wx-hic{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex:none}
.wx-ht{flex:1;min-width:0;display:flex;flex-direction:column}.wx-ht>b{font-size:18px}.wx-ht>span{font-size:12.5px;color:var(--t2);font-weight:600}
.wx-x{width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.wx-body{flex:1;min-height:0;overflow:auto;margin:0 -18px;padding:0 18px 24px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.wx-now{display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px 0 10px;gap:2px}
.wx-place{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:650;color:var(--t2)}
.wx-t{font-size:88px;font-weight:250;letter-spacing:-.05em;line-height:1;margin-left:.2em}
.wx-c{font-size:19px;font-weight:650}
.wx-r{font-size:14px;font-weight:600;color:var(--t2)}
.wx-alert{display:flex;gap:8px;align-items:flex-start;text-align:left;margin-top:12px;padding:10px 12px;border-radius:16px;background:rgba(255,159,10,.28);font-size:13px;line-height:1.35;font-weight:550}
.wx-alert>svg{flex:none;margin-top:1px}.wx-alert b{font-weight:800}
.wx-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.wx-card{border-radius:22px;background:var(--card);padding:12px 14px;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.wx-ch{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--t2);padding-bottom:10px;border-bottom:1px solid var(--sep);margin-bottom:10px}
.wx-ch>span{display:flex;align-items:center;gap:6px}
.wx-hours{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
.wx-hr{flex:none;width:50px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:13px;font-weight:650;padding:4px 0;border-radius:14px}
.wx-hr>em{font-style:normal;font-size:11px;font-weight:800;color:#8ED1FF;height:13px}
.wx-hr>b{font-size:16px;font-weight:700}
.wx-hr.is-now{background:rgba(255,255,255,.14)}
.wx-days{display:flex;flex-direction:column}
.wx-day{display:grid;grid-template-columns:52px 40px 34px minmax(0,1fr) 34px;align-items:center;gap:8px;min-height:44px;border:0;background:transparent;color:inherit;font:inherit;padding:0;cursor:pointer;text-align:left}
.wx-day+.wx-day{border-top:1px solid var(--sep)}
.wx-dn{font-size:15px;font-weight:700}
.wx-di{display:flex;flex-direction:column;align-items:center;line-height:1}.wx-di>em{font-style:normal;font-size:10px;font-weight:800;color:#8ED1FF;margin-top:1px}
.wx-dl{font-size:15px;font-weight:650;color:var(--t2);text-align:right;font-variant-numeric:tabular-nums}
.wx-dh{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.wx-bar{position:relative;height:5px;border-radius:3px;background:rgba(0,0,0,.22)}
.wx-bar>i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#8ED1FF,#A8E6A1 40%,#FFD36B 75%,#FF9F5A)}
.wx-bar>b{position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.wx-day.is-sel{background:rgba(255,255,255,.1);border-radius:12px}
.wx-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.wx-tile{border-radius:20px;background:var(--card);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-height:96px;box-sizing:border-box;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.wx-tl{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--t2)}
.wx-tile>b{font-size:26px;font-weight:650;letter-spacing:-.02em}
.wx-ts{font-size:12px;font-weight:550;color:var(--t2);line-height:1.3}
.wx-tb{position:relative;height:5px;border-radius:3px;margin-top:auto}
.wx-tb>i{position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.wx-src{font-size:11.5px;color:var(--t3);text-align:center;font-weight:600}
/* tablet: dialogo a due colonne */
.wx-p.is-tab{left:50%;top:50%;bottom:auto;transform:translate(-50%,-50%);width:min(900px,calc(100% - 48px));height:min(640px,calc(100% - 48px));border-radius:34px;background:rgba(255,255,255,.08);box-shadow:0 0 0 1px rgba(255,255,255,.16),0 40px 100px -30px rgba(0,0,0,.6);padding:20px 24px 0}
.wx-p.is-tab .wx-body{flex-direction:row;gap:24px;align-items:flex-start;margin:0 -24px;padding:0 24px 24px}
.wx-p.is-tab .wx-now{width:260px;flex:none;position:sticky;top:0;padding-top:40px}
.wx-p.is-tab .wx-col{flex:1}
.wx-p.is-tab .wx-tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
/* colonna neutra della Home */
.wx-root.is-col{background:#F2F2F6;color:#111113;--t2:rgba(60,60,67,.66);--t3:rgba(60,60,67,.45);--card:rgba(60,45,30,.06);--sep:rgba(60,60,67,.1)}
.wx-root.is-col.is-dark{background:#000;color:#F5F5F7;--t2:rgba(235,235,245,.66);--t3:rgba(235,235,245,.42);--card:rgba(255,255,255,.08);--sep:rgba(255,255,255,.1)}
.is-col .wx-sky,.is-col .wx-rain{display:none}
.is-col .wx-p{inset:12px;height:auto;border-radius:30px;background:#FFFFFF;box-shadow:0 0 0 1px rgba(0,0,0,.05);-webkit-backdrop-filter:none;backdrop-filter:none}
.is-col.is-dark .wx-p{background:#1C1C1E;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.is-col .wx-hic{background:var(--accW);color:#fff}
.is-col .wx-x{background:var(--card);color:inherit}
.is-col .wx-t{font-size:72px;font-weight:300}
.is-col .wx-hr>em,.is-col .wx-di>em{color:#0A84FF}
.is-col .wx-bar{background:var(--sep)}
.is-col .wx-alert{background:rgba(255,159,10,.16);color:inherit}
.is-col .wx-hr.is-now,.is-col .wx-day.is-sel{background:var(--card)}
.is-col .wx-card,.is-col .wx-tile{-webkit-backdrop-filter:none;backdrop-filter:none}

</style>
</helmet>
<div class="wx-root {{rootCls}}" lang="it">
<div class="wx-sky" aria-hidden="true" style="background: {{sky}}"></div>
<sc-if value="{{rain}}" hint-placeholder-val="{{false}}"><div class="wx-rain" aria-hidden="true"></div></sc-if>
<section class="wx-p {{layCls}}" role="dialog" aria-label="Meteo">
<header class="wx-h"><span class="wx-hic"><sc-if value="{{ic.sun}}" hint-placeholder-val="{{true}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"></path></svg></sc-if>
<sc-if value="{{ic.partly}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3.5v1.2M3.5 8H4.7M4.8 4.8l.9.9M11.2 4.8l-.9.9"></path><path d="M5.2 10.8A3.2 3.2 0 1 1 10.8 7.2"></path><path d="M9 20h8.5a3.5 3.5 0 0 0 .3-7A5 5 0 0 0 8.4 14 3 3 0 0 0 9 20z"></path></svg></sc-if>
<sc-if value="{{ic.cloud}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .4-8A6 6 0 0 0 6 9.5 4.3 4.3 0 0 0 7 18z"></path></svg></sc-if>
<sc-if value="{{ic.rain}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 15h10a4 4 0 0 0 .4-8A6 6 0 0 0 6 6.5 4.3 4.3 0 0 0 7 15z"></path><path d="M9 18l-1 3M13 18l-1 3M17 18l-1 3"></path></svg></sc-if>
<sc-if value="{{ic.moon}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></sc-if>
<sc-if value="{{ic.storm}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 16a4.5 4.5 0 1 1 .9-8.9A6 6 0 0 1 19 9a3.5 3.5 0 0 1-1 7"></path><path d="m13 12-3 5h4l-3 5"></path></svg></sc-if></span><span class="wx-ht"><b>Meteo · Casa</b><span>{{upd}}</span></span><button type="button" class="wx-x" aria-label="Chiudi"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></header>
<div class="wx-body">
<div class="wx-now">
<span class="wx-place"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"></path><circle cx="12" cy="10" r="2.3"></circle></svg> Via Roma, Milano</span>
<b class="wx-t">{{t}}</b>
<span class="wx-c">{{cond}}</span>
<span class="wx-r">Max {{hi}} · min {{lo}} · percepita {{feel}}</span>
<sc-if value="{{hasAlert}}" hint-placeholder-val="{{false}}"><div class="wx-alert" role="alert"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5"></path><path d="M12 16.2v.01"></path></svg><span><b>{{alT}}</b> {{alS}}</span></div></sc-if>
</div>
<div class="wx-col">
<div class="wx-card">
<div class="wx-ch"><span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg> {{hSum}}</span></div>
<div class="wx-hours"><sc-for list="{{hours}}" as="h" hint-placeholder-count="12"><span class="wx-hr {{h.cls}}"><span>{{h.t}}</span><sc-if value="{{h.ic.sun}}" hint-placeholder-val="{{true}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"></path></svg></sc-if>
<sc-if value="{{h.ic.partly}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3.5v1.2M3.5 8H4.7M4.8 4.8l.9.9M11.2 4.8l-.9.9"></path><path d="M5.2 10.8A3.2 3.2 0 1 1 10.8 7.2"></path><path d="M9 20h8.5a3.5 3.5 0 0 0 .3-7A5 5 0 0 0 8.4 14 3 3 0 0 0 9 20z"></path></svg></sc-if>
<sc-if value="{{h.ic.cloud}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .4-8A6 6 0 0 0 6 9.5 4.3 4.3 0 0 0 7 18z"></path></svg></sc-if>
<sc-if value="{{h.ic.rain}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 15h10a4 4 0 0 0 .4-8A6 6 0 0 0 6 6.5 4.3 4.3 0 0 0 7 15z"></path><path d="M9 18l-1 3M13 18l-1 3M17 18l-1 3"></path></svg></sc-if>
<sc-if value="{{h.ic.moon}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></sc-if>
<sc-if value="{{h.ic.storm}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 16a4.5 4.5 0 1 1 .9-8.9A6 6 0 0 1 19 9a3.5 3.5 0 0 1-1 7"></path><path d="m13 12-3 5h4l-3 5"></path></svg></sc-if><em style="opacity: {{h.pOp}}">{{h.p}}</em><b>{{h.v}}</b></span></sc-for></div>
</div>
<div class="wx-card">
<div class="wx-ch"><span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="3"></rect><path d="M3 9.5h18M8 2.5v4M16 2.5v4"></path></svg> Prossimi 7 giorni</span></div>
<div class="wx-days"><sc-for list="{{days}}" as="d" hint-placeholder-count="7"><button type="button" class="wx-day {{d.cls}}" onClick="{{d.pick}}"><span class="wx-dn">{{d.n}}</span><span class="wx-di"><sc-if value="{{d.ic.sun}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"></path></svg></sc-if>
<sc-if value="{{d.ic.partly}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3.5v1.2M3.5 8H4.7M4.8 4.8l.9.9M11.2 4.8l-.9.9"></path><path d="M5.2 10.8A3.2 3.2 0 1 1 10.8 7.2"></path><path d="M9 20h8.5a3.5 3.5 0 0 0 .3-7A5 5 0 0 0 8.4 14 3 3 0 0 0 9 20z"></path></svg></sc-if>
<sc-if value="{{d.ic.cloud}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .4-8A6 6 0 0 0 6 9.5 4.3 4.3 0 0 0 7 18z"></path></svg></sc-if>
<sc-if value="{{d.ic.rain}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 15h10a4 4 0 0 0 .4-8A6 6 0 0 0 6 6.5 4.3 4.3 0 0 0 7 15z"></path><path d="M9 18l-1 3M13 18l-1 3M17 18l-1 3"></path></svg></sc-if>
<sc-if value="{{d.ic.moon}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></sc-if>
<sc-if value="{{d.ic.storm}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 16a4.5 4.5 0 1 1 .9-8.9A6 6 0 0 1 19 9a3.5 3.5 0 0 1-1 7"></path><path d="m13 12-3 5h4l-3 5"></path></svg></sc-if><em style="opacity: {{d.pOp}}">{{d.p}}</em></span><span class="wx-dl">{{d.lo}}</span><span class="wx-bar"><i style="left: {{d.l}}; width: {{d.w}}"></i><sc-if value="{{d.isNow}}" hint-placeholder-val="{{false}}"><b style="left: {{d.now}}"></b></sc-if></span><span class="wx-dh">{{d.hi}}</span></button></sc-for></div>
</div>
<div class="wx-tiles"><sc-for list="{{tiles}}" as="x" hint-placeholder-count="6"><div class="wx-tile"><span class="wx-tl"><sc-if value="{{x.ic.thermo}}" hint-placeholder-val="{{true}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"></path></svg></sc-if>
<sc-if value="{{x.ic.drop}}" hint-placeholder-val="{{false}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3s6 6.4 6 11a6 6 0 0 1-12 0c0-4.6 6-11 6-11z"></path></svg></sc-if>
<sc-if value="{{x.ic.wind}}" hint-placeholder-val="{{false}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h11a3 3 0 1 0-3-3"></path><path d="M3 12h16a3 3 0 1 1-3 3"></path><path d="M3 16h7"></path></svg></sc-if>
<sc-if value="{{x.ic.sun}}" hint-placeholder-val="{{false}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"></path></svg></sc-if>
<sc-if value="{{x.ic.sunrise}}" hint-placeholder-val="{{false}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18h16"></path><path d="M7 18a5 5 0 0 1 10 0"></path><path d="M12 4v4"></path><path d="m9 6 3-3 3 3"></path></svg></sc-if>
<sc-if value="{{x.ic.gauge}}" hint-placeholder-val="{{false}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18a8 8 0 1 1 16 0"></path><path d="m12 18 4-6"></path></svg></sc-if>
<sc-if value="{{x.ic.umbrella}}" hint-placeholder-val="{{false}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 18 0z"></path><path d="M12 12v6a2 2 0 0 0 4 0"></path><path d="M12 3v1"></path></svg></sc-if>

<script type="text/x-dc" data-dc-script data-props='{"view":{"editor":"enum","options":["phone","tablet","column"],"default":"phone"},"scene":{"editor":"enum","options":["day","rain","night","alert"],"default":"day"},"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const P = this.props, S = this.state || {}, set = (p) => this.setState(p);
    const sc = P.scene || 'day', view = P.view || 'phone', dark = P.dark ?? true;
    const WI = ['sun', 'partly', 'cloud', 'rain', 'moon', 'storm'];
    const fl = (k) => { const o = {}; WI.forEach((x) => { o[x] = x === k; }); return o; };
    const D = {
      day: { ic: 'partly', t: 14, cond: 'Parzialmente nuvoloso', hi: 16, lo: 8, feel: 12, sky: 'linear-gradient(180deg,#3E7CC9 0%,#6FA3DF 45%,#9DBFE8 100%)', hSum: 'Nuvole in aumento dalle 17, pioggia debole verso le 20',
        hours: [['Ora', 'partly', 14, 0], ['15', 'partly', 15, 0], ['16', 'partly', 15, 10], ['17', 'cloud', 14, 20], ['18', 'cloud', 13, 30], ['19', 'cloud', 12, 50], ['20', 'rain', 11, 70], ['21', 'rain', 10, 80], ['22', 'rain', 10, 60], ['23', 'moon', 9, 20], ['0', 'moon', 9, 10], ['1', 'moon', 8, 0]] },
      rain: { ic: 'rain', t: 11, cond: 'Pioggia', hi: 12, lo: 7, feel: 8, sky: 'linear-gradient(180deg,#3F4B5C 0%,#5D6B7E 50%,#7D8A9A 100%)', rain: true, hSum: 'Pioggia fino alle 18, poi schiarite',
        hours: [['Ora', 'rain', 11, 90], ['15', 'rain', 11, 90], ['16', 'rain', 11, 80], ['17', 'rain', 10, 60], ['18', 'cloud', 10, 30], ['19', 'cloud', 9, 10], ['20', 'moon', 9, 0], ['21', 'moon', 8, 0], ['22', 'moon', 8, 0], ['23', 'moon', 7, 0], ['0', 'moon', 7, 0], ['1', 'moon', 7, 0]] },
      night: { ic: 'moon', t: 8, cond: 'Sereno', hi: 15, lo: 5, feel: 6, sky: 'linear-gradient(180deg,#0B1530 0%,#1C2B55 55%,#2E3F6E 100%)', hSum: 'Cielo sereno tutta la notte, minima 5° all’alba',
        hours: [['Ora', 'moon', 8, 0], ['23', 'moon', 7, 0], ['0', 'moon', 7, 0], ['1', 'moon', 6, 0], ['2', 'moon', 6, 0], ['3', 'moon', 5, 0], ['4', 'moon', 5, 0], ['5', 'moon', 5, 0], ['6', 'partly', 5, 0], ['7', 'sun', 6, 0], ['8', 'sun', 8, 0], ['9', 'sun', 10, 0]] },
      alert: { ic: 'storm', t: 17, cond: 'Temporale', hi: 19, lo: 12, feel: 17, sky: 'linear-gradient(180deg,#2B2F3A 0%,#4A4458 50%,#6B5C66 100%)', rain: true, al: ['Allerta arancione per temporali', 'Fino alle 21. Possibili grandine e raffiche oltre 60 km/h: le tende da sole sono state chiuse.'], hSum: 'Temporali fino alle 21, poi in attenuazione',
        hours: [['Ora', 'storm', 17, 90], ['15', 'storm', 17, 90], ['16', 'storm', 16, 80], ['17', 'rain', 15, 70], ['18', 'rain', 15, 60], ['19', 'rain', 14, 50], ['20', 'storm', 14, 60], ['21', 'cloud', 13, 30], ['22', 'cloud', 13, 20], ['23', 'moon', 12, 0], ['0', 'moon', 12, 0], ['1', 'moon', 12, 0]] }
    }[sc];
    const DAYS = [['Oggi', D.ic, D.lo, D.hi, sc === 'rain' ? 90 : sc === 'alert' ? 90 : 40], ['Gio', 'rain', 7, 12, 80], ['Ven', 'cloud', 8, 13, 20], ['Sab', 'sun', 9, 17, 0], ['Dom', 'sun', 10, 18, 0], ['Lun', 'partly', 9, 16, 10], ['Mar', 'rain', 8, 13, 60]];
    const gLo = 4, gHi = 20, pc = (v) => ((v - gLo) / (gHi - gLo) * 100) + '%';
    const selD = S.d ?? 0;
    const T = [
      ['thermo', 'Percepita', D.feel + '°', D.feel < D.t ? 'Il vento la fa sembrare più fresca' : 'Simile a quella reale'],
      ['drop', 'Umidità', sc === 'rain' || sc === 'alert' ? '94%' : '72%', 'Punto di rugiada 9°'],
      ['wind', 'Vento', sc === 'alert' ? '48 km/h' : '14 km/h', sc === 'alert' ? 'Raffiche fino a 68 km/h da SO' : 'Da nord-ovest · raffiche 22'],
      ['sun', 'Indice UV', sc === 'night' ? '0' : sc === 'day' ? '3' : '1', sc === 'night' ? 'Nessuno di notte' : sc === 'day' ? 'Moderato fino alle 15' : 'Basso', true, sc === 'day' ? 0.27 : 0.05],
      ['sunrise', 'Sole', sc === 'night' ? '6:52' : '17:08', sc === 'night' ? 'Alba · tramonto alle 17:08' : 'Tramonto · alba alle 6:52'],
      ['umbrella', 'Pioggia', sc === 'day' ? '1 mm' : sc === 'night' ? '0 mm' : '14 mm', sc === 'day' ? 'Attesi in serata' : sc === 'night' ? 'Nessuna nelle prossime 24 ore' : 'Nelle ultime 3 ore']
    ];
    return {
      rootCls: (view === 'column' ? 'is-col ' : '') + (dark ? 'is-dark' : ''), layCls: view === 'tablet' ? 'is-tab' : '',
      sky: D.sky, rain: !!D.rain && view !== 'column', ic: fl(D.ic), upd: 'Aggiornato 5 min fa', upd2: 'alle 14:35',
      t: D.t + '°', cond: D.cond, hi: D.hi + '°', lo: D.lo + '°', feel: D.feel + '°',
      hasAlert: !!D.al, alT: D.al ? D.al[0] + '.' : '', alS: D.al ? D.al[1] : '', hSum: D.hSum,
      hours: D.hours.map((h, i) => ({ t: h[0], ic: fl(h[1]), v: h[2] + '°', p: h[3] >= 20 ? h[3] + '%' : '', pOp: h[3] >= 20 ? 1 : 0, cls: i === 0 ? 'is-now' : '' })),
      days: DAYS.map((d, i) => ({ n: d[0], ic: fl(d[1]), lo: d[2] + '°', hi: d[3] + '°', l: pc(d[2]), w: ((d[3] - d[2]) / (gHi - gLo) * 100) + '%', p: d[4] >= 20 ? d[4] + '%' : '', pOp: d[4] >= 20 ? 1 : 0, isNow: i === 0, now: ((D.t - d[2]) / (d[3] - d[2]) * 100) + '%', cls: i === selD ? 'is-sel' : '', pick: () => set({ d: i }) })),
      tiles: T.map((x) => ({ ic: { thermo: x[0] === 'thermo', drop: x[0] === 'drop', wind: x[0] === 'wind', sun: x[0] === 'sun', sunrise: x[0] === 'sunrise', gauge: false, umbrella: x[0] === 'umbrella', eye: false }, k: x[1], v: x[2], s: x[3], hasBar: !!x[4], barBg: 'linear-gradient(90deg,#30D158,#FFD60A,#FF9F0A,#FF453A,#BF5AF2)', at: ((x[5] || 0) * 100) + '%' }))
    };
  }
}

</script>
