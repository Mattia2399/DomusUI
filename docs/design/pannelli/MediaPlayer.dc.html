<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Media player</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.mp-root{position:absolute;inset:0;overflow:hidden;color:#FFFFFF;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI Variable',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#0B0B0D;--t2:rgba(255,255,255,.66);--t3:rgba(255,255,255,.42);--g:rgba(255,255,255,.14);--g2:rgba(255,255,255,.22)}
.mp-root.is-col{background:#F2F2F6;color:#111113;--t2:rgba(60,60,67,.66);--t3:rgba(60,60,67,.42);--g:rgba(60,45,30,.08);--g2:rgba(60,45,30,.13)}
.mp-root.is-col.is-dark{background:#000;color:#F5F5F7;--t2:rgba(235,235,245,.66);--t3:rgba(235,235,245,.42);--g:rgba(255,255,255,.1);--g2:rgba(255,255,255,.16)}
.mp-root.is-cardv{background:#E9ECF2;color:#111113}
.mp-root.is-cardv.is-dark{background:#000;color:#F5F5F7}
.mp-bg{position:absolute;inset:-80px;filter:blur(60px) saturate(1.4);transform:scale(1.1);transition:background .8s}
.mp-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,.45) 55%,rgba(0,0,0,.7))}
.is-col .mp-bg,.is-col .mp-shade{display:none}
.mp-p{position:absolute;inset:0;display:flex;flex-direction:column;padding:16px 24px 26px;box-sizing:border-box}
.mp-h{display:flex;align-items:center;gap:10px;flex:none}
.mp-hb{width:48px;height:48px;border:0;border-radius:50%;background:var(--g);color:inherit;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.mp-hb.is-off{background:#FFFFFF;color:#111}
.mp-on{flex:1;min-width:0;border:0;background:transparent;color:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 0;border-radius:14px}
.mp-on:hover{background:var(--g)}
.mp-onl{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--t2)}
.mp-ond{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:650;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.mp-main{flex:1;min-height:0;display:flex;flex-direction:column;gap:0}
.mp-art{flex:none;display:flex;justify-content:center;padding:22px 4px 22px}
.mp-cv{position:relative;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.55);overflow:hidden;flex:none}
.mp-cv-l{width:100%;max-width:340px;aspect-ratio:1;border-radius:22px;box-shadow:0 30px 60px -24px rgba(0,0,0,.7);transition:transform .4s}
.mp-cv-l.is-paused{transform:scale(.86)}
.mp-cv-l.is-src{background:rgba(255,255,255,.08)!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.mp-cv>svg{position:relative;z-index:1}
.mp-cv:not(.is-src)>svg{opacity:0}
.mp-cvsrc{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:14px;font-weight:700;color:rgba(255,255,255,.8)}
.mp-side{display:flex;flex-direction:column;gap:16px;min-width:0}
.mp-meta>b{display:block;font-size:24px;font-weight:750;letter-spacing:-.02em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-meta>span{display:block;font-size:16px;font-weight:600;color:var(--t2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-pb{position:relative;height:8px;border-radius:4px;background:var(--g2);cursor:pointer;touch-action:none}
.mp-pb::before{content:'';position:absolute;inset:-12px 0}
.mp-pb>i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:currentColor}
.mp-pt{display:flex;justify-content:space-between;font-size:12.5px;font-weight:650;color:var(--t2);margin-top:8px;font-variant-numeric:tabular-nums}
.mp-ctl{display:flex;align-items:center;justify-content:space-between;padding:0 2px}
.mp-ib{width:48px;height:48px;border:0;border-radius:50%;background:transparent;color:var(--t2);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.mp-ib.is-on{color:inherit;background:var(--g)}
.mp-ib em{position:absolute;right:8px;top:8px;font-style:normal;font-size:9px;font-weight:900}
.mp-ib.mp-big{color:inherit;width:60px;height:60px}
.mp-play{width:88px;height:88px;border:0;border-radius:50%;background:#FFFFFF;color:#0B0B0F;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 16px 34px -14px rgba(0,0,0,.6);transition:transform .12s}
.mp-play:active{transform:scale(.94)}
.is-col .mp-play{background:#0B0B0F;color:#FFF}
.is-col.is-dark .mp-play{background:#F5F5F7;color:#0B0B0F}
.mp-vol{display:flex;align-items:center;gap:10px}
.mp-vol .mp-ib{color:inherit;flex:none}
.mp-vb{position:relative;flex:1;height:46px;border-radius:16px;background:var(--g);overflow:hidden;cursor:ew-resize;touch-action:none}
.mp-vb>i{position:absolute;left:0;top:0;bottom:0;border-radius:16px;background:currentColor;min-width:32px;opacity:.95}
.mp-vv{width:44px;text-align:right;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.mp-zone{flex:1;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end}
.mp-scs{display:flex;justify-content:space-around;gap:10px}
.mp-sc{border:0;background:transparent;color:inherit;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:650;cursor:pointer;width:72px}
.mp-scc{width:48px;height:48px;border-radius:50%;background:var(--g);display:flex;align-items:center;justify-content:center}
.mp-sc.is-on .mp-scc{background:#FFFFFF;color:#111}
.is-col .mp-sc.is-on .mp-scc{background:var(--acc,#0B0B0F);color:#fff}
.mp-panel{display:flex;flex-direction:column;gap:10px;border-radius:22px;background:rgba(0,0,0,.28);padding:14px;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.is-col .mp-panel{background:var(--g)}
.mp-pt2{display:flex;flex-direction:column;gap:2px}.mp-pt2>b{font-size:15px}.mp-pt2>span{font-size:12px;color:var(--t2);font-weight:550}
.mp-list{display:flex;flex-direction:column}
.mp-li{display:flex;flex-direction:column;gap:6px;padding:6px 0}
.mp-li+.mp-li{border-top:1px solid var(--g)}
.mp-lim{border:0;background:transparent;color:inherit;display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer;padding:0}
.mp-chk{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--g2);display:flex;align-items:center;justify-content:center;color:transparent;flex:none}
.mp-li.is-on .mp-chk{background:#FFFFFF;color:#111;box-shadow:none}
.is-col .mp-li.is-on .mp-chk{background:#0A84FF;color:#fff}
.mp-lit{display:flex;flex-direction:column}.mp-lit>b{font-size:14.5px}.mp-lit>span{font-size:12px;color:var(--t2)}
.mp-mini{height:6px;border-radius:3px;background:var(--g2);margin-left:32px;overflow:hidden}.mp-mini>i{display:block;height:100%;background:currentColor;border-radius:3px}
.mp-chips{display:flex;flex-wrap:wrap;gap:8px}
.mp-chip{height:40px;border:0;border-radius:20px;padding:0 15px;background:var(--g);color:inherit;font-size:14px;font-weight:620;cursor:pointer}
.mp-chip.is-on{background:#FFFFFF;color:#111}
.is-col .mp-chip.is-on{background:#0B0B0F;color:#fff}
.is-col.is-dark .mp-chip.is-on{background:#F5F5F7;color:#0B0B0F}
.mp-back{align-self:center;border:0;background:transparent;color:inherit;font-size:13.5px;font-weight:650;display:flex;align-items:center;gap:4px;cursor:pointer;margin-top:10px}
.mp-empty{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding-bottom:10px}
.mp-empty>b{font-size:16px}.mp-empty>span{font-size:13px;color:var(--t2)}
/* tablet: copertina a sinistra, controlli a destra */
.mp-p.is-tab{inset:40px;border-radius:34px;overflow:hidden;background:rgba(20,20,24,.35);box-shadow:0 0 0 1px rgba(255,255,255,.12),0 40px 100px -30px rgba(0,0,0,.7);padding:20px 28px 26px;-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px)}
.mp-p.is-tab .mp-main{flex-direction:row;align-items:center;gap:34px}
.mp-p.is-tab .mp-art{padding:0;width:42%}
.mp-p.is-tab .mp-cv-l{max-width:none}
.mp-p.is-tab .mp-side{flex:1;gap:18px}
.mp-p.is-tab .mp-zone{flex:none;min-height:0}
/* colonna neutra della Home */
.is-col .mp-p{inset:12px;border-radius:30px;background:#FFFFFF;padding:16px 18px 20px;box-shadow:0 0 0 1px rgba(0,0,0,.05)}
.is-col.is-dark .mp-p{background:#1C1C1E;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.is-col .mp-hb{-webkit-backdrop-filter:none;backdrop-filter:none}
.is-col .mp-art{padding:12px 30px 16px}
.is-col .mp-meta>b{font-size:19px}.is-col .mp-meta>span{font-size:14px}
.is-col .mp-side{gap:12px}
.is-col .mp-pb>i,.is-col .mp-vb>i{background:var(--acc)}
.is-col .mp-play{width:72px;height:72px}
.is-col .mp-ib.mp-big{width:52px;height:52px}
/* card */
.mp-cardwrap{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:20px;box-sizing:border-box}
.mp-card{display:grid;grid-template-columns:150px minmax(0,1fr);grid-template-rows:auto 1fr auto;gap:10px 16px;padding:16px;border-radius:28px;background:#ECECF0;color:#111113;height:174px;box-sizing:border-box;box-shadow:0 16px 36px -18px rgba(0,0,0,.5)}
.mp-cv-s{grid-row:1/4;width:142px;height:142px;border-radius:18px}
.mp-ct{min-width:0;display:flex;flex-direction:column;gap:2px}
.mp-scroll{overflow:hidden;white-space:nowrap;mask-image:linear-gradient(90deg,#000 85%,transparent);-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent)}
.mp-scroll b{display:inline-block;font-size:17px;font-weight:700;padding-right:40px}
.mp-scroll b.is-run{animation:mp-mq 9s linear 1.2s infinite}
@keyframes mp-mq{0%,8%{transform:translateX(0)}92%,100%{transform:translateX(calc(-100% + 160px))}}
@media (prefers-reduced-motion: reduce){.mp-scroll b.is-run{animation:none}}
.mp-ca{font-size:14px;font-weight:550;color:rgba(60,60,67,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-cprog{display:block;height:6px;border-radius:3px;background:rgba(0,0,0,.08);margin-top:10px;overflow:hidden}.mp-cprog>i{display:block;height:100%;background:#111;border-radius:3px}
.mp-cdev{display:none}
.mp-cbtns{grid-column:2;display:flex;gap:10px;align-items:center}
.mp-rb{width:46px;height:46px;border:0;border-radius:50%;background:rgba(0,0,0,.07);color:#111;display:flex;align-items:center;justify-content:center;cursor:pointer}
.mp-rb-p{background:#0B0B0F;color:#fff}
.mp-cnote{font-size:12px;font-weight:600;color:rgba(60,60,67,.6);text-align:center}
.is-dark .mp-cnote{color:rgba(235,235,245,.6)}
.mp-root{--acc:#9C7A45}
.mp-p.has-zone:not(.is-tab) .mp-art{padding:8px 4px 12px}
.mp-p.has-zone:not(.is-tab) .mp-cv-l{max-width:132px;border-radius:16px}
.mp-p.has-zone:not(.is-tab) .mp-side{gap:12px}
.mp-p.has-zone .mp-zone{justify-content:flex-start;overflow:auto}
.mp-p.is-tab.has-zone .mp-zone{max-height:260px}
.is-col .mp-p.has-zone .mp-cv-l{max-width:110px}
.mp-sc>span:last-child{white-space:nowrap}

</style>
</helmet>
<div class="mp-root {{rootCls}}" lang="it">
<sc-if value="{{isCard}}" hint-placeholder-val="{{false}}">
<div class="mp-cardwrap">
<div class="mp-card {{cardCls}}">
<span class="mp-cv mp-cv-s" style="background: {{cover}}"><sc-if value="{{cvIc.music}}" hint-placeholder-val="{{true}}"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="17" cy="16" r="3"></circle></svg></sc-if>
<sc-if value="{{cvIc.tv}}" hint-placeholder-val="{{false}}"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="12" rx="2"></rect><path d="M8 21h8"></path></svg></sc-if>
<sc-if value="{{cvIc.speaker}}" hint-placeholder-val="{{false}}"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="3" width="12" height="18" rx="3"></rect><circle cx="12" cy="14" r="3"></circle><path d="M12 7v.01"></path></svg></sc-if></span>
<span class="mp-ct"><span class="mp-scroll"><b class="{{scrollCls}}">{{title}}</b></span><span class="mp-ca">{{artist}}</span>
<span class="mp-cprog"><i style="width: {{progW}}"></i></span></span>
<span class="mp-cdev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="3" width="12" height="18" rx="3"></rect><circle cx="12" cy="14" r="3"></circle><path d="M12 7v.01"></path></svg> {{devName}}</span>
<span class="mp-cbtns"><button type="button" class="mp-rb" onClick="{{prev}}" aria-label="Precedente"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 5v14"></path><path d="M19 5.5L9.5 12l9.5 6.5z" fill="currentColor"></path></svg></button><button type="button" class="mp-rb mp-rb-p" onClick="{{toggle}}" aria-label="{{playAria}}"><sc-if value="{{playIc.pause}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5v14"></path><path d="M16 5v14"></path></svg></sc-if>
<sc-if value="{{playIc.play}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"></path></svg></sc-if></button><button type="button" class="mp-rb" onClick="{{next}}" aria-label="Successivo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 5v14"></path><path d="M5 5.5l9.5 6.5L5 18.5z" fill="currentColor"></path></svg></button></span>
</div>
<span class="mp-cnote">Tocca la card per aprire il player · la barra del volume sta solo nel player</span>
</div>
</sc-if>
<sc-if value="{{isPlayer}}" hint-placeholder-val="{{true}}">
<div class="mp-bg" aria-hidden="true" style="background: {{bgGrad}}"></div><div class="mp-shade" aria-hidden="true"></div>
<section class="mp-p {{layoutCls}} {{zoneCls}}" role="dialog" aria-label="Player">
<header class="mp-h">
<button type="button" class="mp-hb" aria-label="Chiudi"><sc-if value="{{closeIc.chevDown}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></sc-if>
<sc-if value="{{closeIc.x}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></sc-if></button>
<button type="button" class="mp-on" onClick="{{openCasse}}"><span class="mp-onl">{{onLabel}}</span><span class="mp-ond"><sc-if value="{{devIc.speaker}}" hint-placeholder-val="{{true}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="3" width="12" height="18" rx="3"></rect><circle cx="12" cy="14" r="3"></circle><path d="M12 7v.01"></path></svg></sc-if>
<sc-if value="{{devIc.tv}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="12" rx="2"></rect><path d="M8 21h8"></path></svg></sc-if>
<sc-if value="{{devIc.layers}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"></path><path d="M3 13l9 5 9-5"></path></svg></sc-if> {{devName}} <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span></button>
<button type="button" class="mp-hb {{powCls}}" onClick="{{power}}" aria-label="{{powAria}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v8"></path><path d="M6.3 6.8a8 8 0 1 0 11.4 0"></path></svg></button>
</header>
<div class="mp-main">
<div class="mp-art"><span class="mp-cv mp-cv-l {{cvCls}}" style="background: {{cover}}"><sc-if value="{{cvIc.music}}" hint-placeholder-val="{{true}}"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="17" cy="16" r="3"></circle></svg></sc-if>
<sc-if value="{{cvIc.tv}}" hint-placeholder-val="{{false}}"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="12" rx="2"></rect><path d="M8 21h8"></path></svg></sc-if>
<sc-if value="{{cvIc.speaker}}" hint-placeholder-val="{{false}}"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="3" width="12" height="18" rx="3"></rect><circle cx="12" cy="14" r="3"></circle><path d="M12 7v.01"></path></svg></sc-if><span class="mp-cvsrc">{{cvSrc}}</span></span></div>
<div class="mp-side">
<div class="mp-meta"><b>{{title}}</b><span>{{artist}}</span></div>
<sc-if value="{{hasProg}}" hint-placeholder-val="{{true}}"><div class="mp-prog"><div class="mp-pb" onPointerDown="{{seekDown}}" onPointerMove="{{seekMove}}" onPointerUp="{{seekUp}}" role="slider" aria-label="Avanzamento" tabindex="0"><i style="width: {{progW}}"></i></div><span class="mp-pt"><span>{{posT}}</span><span>{{leftT}}</span></span></div></sc-if>
<div class="mp-ctl">
<button type="button" class="mp-ib {{shufCls}}" onClick="{{shuf}}" aria-label="Casuale" aria-pressed="{{shufOn}}" style="visibility: {{shufVis}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4h4v4"></path><path d="M4 20L20 4"></path><path d="M20 16v4h-4"></path><path d="M15 15l5 5"></path><path d="M4 4l5 5"></path></svg></button>
<button type="button" class="mp-ib mp-big" onClick="{{prev}}" aria-label="Precedente"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 5v14"></path><path d="M19 5.5L9.5 12l9.5 6.5z" fill="currentColor"></path></svg></button>
<button type="button" class="mp-play" onClick="{{toggle}}" aria-label="{{playAria}}"><sc-if value="{{playIc.pause}}" hint-placeholder-val="{{true}}"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5v14"></path><path d="M16 5v14"></path></svg></sc-if>
<sc-if value="{{playIc.play}}" hint-placeholder-val="{{false}}"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"></path></svg></sc-if></button>
<button type="button" class="mp-ib mp-big" onClick="{{next}}" aria-label="Successivo"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 5v14"></path><path d="M5 5.5l9.5 6.5L5 18.5z" fill="currentColor"></path></svg></button>
